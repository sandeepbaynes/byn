name: Deploy docs site

# Publishes the themed docs site to GitHub Pages. The markdown under docs/ is the
# single source of truth; tools/gensite renders it to HTML at build time (that
# HTML is gitignored and never committed), and this workflow deploys the result.
# Runs on every push to main that touches a site input, and can be run manually.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/gensite/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, and mint the OIDC
# token actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Render docs/*.md → docs/<page>/index.html via the project generator.
      - name: Render themed HTML (gensite)
        run: make site

      # Assemble the servable site root: the hand-authored landing page + assets
      # plus the generated docs HTML. .nojekyll disables Jekyll so paths are
      # served verbatim.
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/assets
          # Only the GENERATED pages. `cp -r docs` copied the markdown sources
          # too, so every file under docs/ was served raw — including
          # docs/design/ and docs/research/, which are internal notes that were
          # never meant to be published and were reachable at their .md path.
          # What is public is what the site manifest renders; nothing else
          # leaves the repo.
          find docs -name index.html -exec cp --parents {} _site/ \;
          # The Agent Skill endpoints, so an agent can install the skill from
          # the docs URL. Generated by `make site` alongside the HTML; named
          # explicitly rather than swept in, for the same reason the docs copy
          # above is.
          cp skill.md _site/
          cp -r .well-known _site/.well-known
          touch _site/.nojekyll

      # A guard, not a comment: the previous rule was also "do not publish the
      # sources", and it was enforced by nobody.
      - name: No markdown sources in the published site
        run: |
          # The Agent Skill is markdown BY SPECIFICATION — agents fetch
          # SKILL.md itself — so it is the one deliberate exception. It is
          # excluded by exact path, not by pattern: the rule this guard exists
          # to enforce is "no doc SOURCES are published", and docs/design/ and
          # docs/research/ reached the live site once already because the rule
          # was written down and enforced by nobody.
          stray="$(find _site -name '*.md' \
            -not -path '_site/skill.md' \
            -not -path '_site/.well-known/*/*/SKILL.md')"
          if [ -n "$stray" ]; then
            echo "::error::markdown sources found in _site — only generated pages and the Agent Skill may be published:"
            echo "$stray"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
